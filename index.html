<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale/user-scalable：关掉双指缩放。iOS 上「双指外扩把整页放成碎片」
         （WKWebView 与主屏 PWA 都会）——这是个应用外壳，不是可缩放的网页文档。
         Safari 标签页里 iOS 会出于无障碍忽略 user-scalable，所以 main.tsx 里还有一道
         gesture 事件闸做兜底，两边合起来才拦得住。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 宽屏布局（第 20 批 · iPad）：首帧前定好左侧栏 class 与「手机布局铺满」的 viewport，免得启动先闪一下侧栏。
         口径与 src/ui/layoutMode.ts 一致，改一处要改两处；ES5 写法（老 WebView 也要能跑）。 -->
    <script>
      (function () {
        try {
          var d = document.documentElement, pref = null;
          try { pref = localStorage.getItem('velvet:sidebarLayout.v1'); } catch (e) {}
          var ipad = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var wide = pref === 'on' ? true : pref === 'off' ? false : !ipad;
          if (wide) { d.classList.add('layout-wide'); return; }
          var w = window.innerWidth;
          if (!(navigator.maxTouchPoints > 0) || w <= 640) return;
          var s = Math.min(1.6, Math.max(1.25, w / 768));
          var m = document.querySelector('meta[name="viewport"]');
          if (m) m.content = 'width=' + Math.round(w / s) + ', user-scalable=no, viewport-fit=cover';
        } catch (e) { document.documentElement.classList.add('layout-wide'); }
      })();
      // 安卓沉浸式（第 33 批）：上一次的状态栏 / 导航栏高度，第一帧之前就套上——以前要等原生回话（启动尾巴之后），
      // 头几秒页面顶在状态栏底下、几秒后整页下移。只有安卓原生壳写这个键（src/utils/nativeBars.ts，键名两处一致），原生的新值再覆盖
      (function () {
        try {
          var raw = localStorage.getItem('velvet:androidInsets.v1');
          if (!raw) return;
          var ins = JSON.parse(raw), d = document.documentElement;
          if (!(ins && ins.top > 0)) return;
          d.style.setProperty('--android-inset-top', Math.round(ins.top) + 'px');
          d.style.setProperty('--android-inset-bottom', Math.max(0, Math.round(ins.bottom || 0)) + 'px');
          d.setAttribute('data-android-edge', '1');
          d.setAttribute('data-nav-mode', String(ins.navMode == null ? -1 : ins.navMode));
        } catch (e) {}
      })();
    </script>

    <!-- SEO 基础标签 -->
    <title>靛蓝色房间 - 个人成长追踪器</title>
    <meta name="description" content="一个帮助你追踪个人成长、管理属性升级、记录每日进度的应用。支持数据统计、任务管理、周目标设置等功能。" />
    <meta name="keywords" content="成长追踪,个人管理,属性升级,任务管理,日志记录" />
    <meta name="author" content="Velvet" />

    <!-- Open Graph（分享到社交媒体显示的内容） -->
    <meta property="og:title" content="靛蓝色房间 - 个人成长追踪器" />
    <meta property="og:description" content="一个帮助你追踪个人成长、管理属性升级、记录每日进度的应用。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:url" content="https://the-velvet.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="靛蓝色房间" />
    <meta name="twitter:description" content="个人成长追踪器" />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- iOS Safari 底部地址栏 / Android Chrome 顶部状态栏的着色。
         这里只设一个中性默认值（和 body bg 的浅色版本同色），
         真正的值在 App.tsx 里根据 settings.darkMode 动态写入，
         这样：(1) App 内手动切夜间模式能联动；(2) 不再被系统 prefers-color-scheme 裹挟。 -->
    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS 全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS PWA immersive status bar. May trigger the iOS 26 bottom chin gap on some devices. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Caveat 手写体：v2.7.0.3 起自托管（public/fonts/caveat-latin-600-normal.woff2，
         @font-face 见 index.css）。原 Google Fonts 外链在无网/受限网络（正是 iOS 实机的
         常态）下加载失败，手写字回退系统体并连带绝对定位错位——外链彻底移除。 -->
    <!-- 思源黑体 Black（自托管分片，v2.7 字体批次）：展示字重专用——
         苹方没有 Black 字重，font-black 的中文在 mac/iOS 只能仿粗（用户上报）。
         unicode-range 分片按需加载；font-display swap，加载期落系统黑体不白屏。 -->
    <link rel="stylesheet" href="/fonts/noto-sc-black.v2.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动看门狗的第一道脚印：模块脚本根本没跑（老 WebView 解析不了产物）时只有这条在，见 utils/bootGuard -->
    <script>try{localStorage.setItem('velvet:boot.html',String(Date.now()))}catch(e){}</script>
    <!-- 旧 WebView 提示屏（第 22 批 · 安卓 9 华为「纯白」）：产物用了 Chrome 80+ 的语法，老内核上模块脚本根本不跑、
         只剩一张白纸。这里用 ES5 判内核版本，低于 80 就先画一段说明；模块脚本一跑起来就把它摘掉（main.tsx），
         所以哪怕 UA 判错也只是闪一下。Safari / WKWebView 的 UA 没有 Chrome 字样，不受影响。 -->
    <div id="webview-notice" hidden></div>
    <script>
      (function () {
        try {
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
          if (!m) return;
          var v = parseInt(m[1], 10);
          if (!(v < 80)) return;
          var el = document.getElementById('webview-notice');
          if (!el) return;
          el.removeAttribute('hidden');
          el.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#f9fafb;color:#1f2937;font:15px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:72px 28px 28px;box-sizing:border-box;overflow:auto');
          el.innerHTML =
            '<div style="max-width:420px;margin:0 auto">' +
              '<div style="font-size:22px;font-weight:800;margin-bottom:14px">这台手机的网页内核太旧了</div>' +
              '<p style="margin:0 0 12px">靛蓝色房间需要 Chrome 80 以上的系统 WebView 才能运行，这台机器现在是 <b>Chrome ' + v + '</b>，所以打开后只有一片白。</p>' +
              '<p style="margin:0 0 8px;font-weight:700">怎么更新</p>' +
              '<ol style="margin:0 0 12px;padding-left:20px">' +
                '<li>打开应用市场（Google Play / 华为应用市场等），搜索 <b>Android System WebView</b>，点更新；</li>' +
                '<li>没有这一项的话，在应用市场更新 <b>Chrome</b>，再到 系统设置 → 开发者选项 → <b>WebView 实现</b> 里切成 Chrome；</li>' +
                '<li>更新完整个关掉本 App 再打开。</li>' +
              '</ol>' +
              '<p style="margin:0;color:#6b7280;font-size:13px">如果更新不了，把这一屏截图发给我们，告诉我们机型和系统版本。</p>' +
            '</div>';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
